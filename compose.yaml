services:
  web:
    build: ./web
    environment:
      SERVICE_URL: ${SERVICE_URL:-}
      CHAT_SERVICE_PATH: ${CHAT_SERVICE_PATH:-}
      CHAT_SERVICE_TIMEOUT_MS: ${CHAT_SERVICE_TIMEOUT_MS:-}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
    ports:
      - "127.0.0.1:${WEB_PORT:?Set WEB_PORT in .env}:3000"
    depends_on:
      service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: ./web
      target: dependencies
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  service:
    build: ./service
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
  postgres-data:
